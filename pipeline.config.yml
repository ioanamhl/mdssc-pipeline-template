# =============================================================================
#  MDSSC Pipeline Template — pipeline.config.yml
#  Singurul fișier pe care trebuie să îl completezi.
#  Toate celelalte fișiere citesc valorile de aici automat.
# =============================================================================

# ── Identificare proiect ──────────────────────────────────────────────────────
project_name: "my-app"
github_repo: "https://github.com/your-org/your-repo"

# ── Stack aplicație ───────────────────────────────────────────────────────────
stack: "node"             # node | python | java | go
build_command: "npm run build"
build_output: "dist/"
app_port: 3000

# ── Jenkins ───────────────────────────────────────────────────────────────────
# Alege modul în funcție de infrastructura ta:
#   "none"     → doar GitHub Actions, zero infrastructură necesară
#   "docker"   → Jenkins local via Docker (bun pentru demo/dev)
#   "external" → Jenkins pe VPS propriu (recomandat pentru producție)
jenkins_mode: "none"

# Adresa unde va fi accesibil Jenkins (completează doar dacă jenkins_mode != none)
# Exemple:
#   "http://localhost:8080"       → local
#   "http://123.456.78.90:8080"   → VPS cu IP
#   "https://jenkins.firma.com"   → domeniu propriu
jenkins_url: ""
jenkins_port: 8080
jenkins_job: "my-app-pipeline"

# ── Deploy ────────────────────────────────────────────────────────────────────
# Cum se face deploy-ul după build:
#   "pm2"      → PM2 process manager (Node.js)
#   "docker"   → docker-compose up
#   "systemd"  → systemctl restart
#   "none"     → fără deploy automat
deploy_method: "pm2"

# ── MDSSC ─────────────────────────────────────────────────────────────────────
# Pragul de severitate sub care build-ul e blocat:
#   "critical" | "high" | "medium" | "low"
mdssc_threshold: "critical"

# Tipul de scanare:
#   "direct"   → arhivă zip/tar trimisă la MDSSC
#   "indirect" → MDSSC citește direct din Git
#   "both"     → ambele (recomandat)
mdssc_scan_type: "both"
